<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>圣德安座设坛祝福展示</title>

<!-- 引入手写中文字体 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    overflow: hidden;
    font-family: "STKaiti", "KaiTi", "楷体", "SimSun", "宋体", "Microsoft YaHei", serif;
    display: flex;
    flex-direction: column;
    position: relative;
    background: #f6efdc;
  }

  #landscape { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  #landscape .painting {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: 0.85;
    animation: paintingBreath 40s ease-in-out infinite alternate;
  }
  @keyframes paintingBreath {
    0%   { transform: scale(1) translate(0, 0); }
    100% { transform: scale(1.04) translate(-0.6%, -0.6%); }
  }
  #landscape .overlay {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 40%, rgba(253, 248, 232, 0.25) 0%, rgba(246, 239, 220, 0.35) 55%, rgba(236, 223, 192, 0.4) 100%);
    pointer-events: none;
  }
  #landscape .cloud {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.35) 40%, transparent 75%);
    filter: blur(20px); pointer-events: none;
  }
  #landscape .c1 { top: 20%; left: -20%; width: 60%; height: 22%; animation: cloudDrift1 55s linear infinite; }
  #landscape .c2 { top: 40%; left: -30%; width: 70%; height: 26%; animation: cloudDrift2 70s linear infinite; opacity: 0.7; }
  #landscape .c3 { top: 60%; left: -25%; width: 65%; height: 22%; animation: cloudDrift3 85s linear infinite; opacity: 0.6; }
  @keyframes cloudDrift1 { 0%{transform:translateX(0) translateY(0);} 100%{transform:translateX(120vw) translateY(-15px);} }
  @keyframes cloudDrift2 { 0%{transform:translateX(0) translateY(0);} 100%{transform:translateX(120vw) translateY(10px);} }
  @keyframes cloudDrift3 { 0%{transform:translateX(0) translateY(0);} 100%{transform:translateX(120vw) translateY(-8px);} }
  #landscape .ink {
    position: absolute; top: -20px; border-radius: 50%;
    background: radial-gradient(circle, rgba(80, 65, 40, 0.35) 0%, rgba(80, 65, 40, 0) 70%);
    animation: inkFall linear infinite; opacity: 0;
  }
  @keyframes inkFall {
    0% { transform: translateY(-20px) translateX(0) scale(0.6); opacity: 0; }
    10% { opacity: 0.8; } 90% { opacity: 0.5; }
    100% { transform: translateY(110vh) translateX(var(--drift, 40px)) scale(1); opacity: 0; }
  }

  #goldDust { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
  .dust {
    position: absolute; top: -20px; width: 6px; height: 6px; border-radius: 50%;
    background: radial-gradient(circle, #fff6c9 0%, #ffd966 40%, rgba(212, 175, 55, 0) 70%);
    box-shadow: 0 0 8px rgba(255, 215, 100, 0.9);
    animation: fall linear infinite; opacity: 0;
  }
  @keyframes fall {
    0% { transform: translateY(-20px) translateX(0) scale(0.6); opacity: 0; }
    10% { opacity: 0.9; } 90% { opacity: 0.7; }
    100% { transform: translateY(110vh) translateX(var(--drift, 30px)) scale(1); opacity: 0; }
  }

  #snowLayer { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
  .snowflake {
    position: absolute; top: -30px; color: #ffffff;
    user-select: none; pointer-events: none;
    text-shadow: 0 0 6px rgba(255,255,255,0.9), 0 0 12px rgba(200,220,255,0.6);
    animation: snowFall linear infinite; opacity: 0;
  }
  @keyframes snowFall {
    0% { transform: translateY(-30px) translateX(0) rotate(0deg); opacity: 0; }
    8% { opacity: var(--maxOp, 0.9); } 90% { opacity: var(--maxOp, 0.9); }
    100% { transform: translateY(110vh) translateX(var(--drift, 30px)) rotate(360deg); opacity: 0; }
  }

  #title { width: 100%; text-align: center; padding: 18px 10px 10px; z-index: 10; position: relative; }
  #title::before {
    content: ""; position: absolute; top: 50%; left: 50%;
    width: 900px; height: 200px; transform: translate(-50%, -50%);
    background: radial-gradient(ellipse, rgba(255, 245, 210, 0.75) 0%, transparent 70%);
    pointer-events: none; z-index: -1;
  }
  #title .line1 {
    font-family: "STKaiti","KaiTi","楷体",serif;
    font-size: 1.4em; letter-spacing: 12px; color: #8b6b2e; margin-bottom: 4px;
    text-shadow: 0 1px 3px rgba(139, 107, 46, 0.3);
  }
  #title .line2 {
    font-family: "STKaiti","KaiTi","楷体","STSong","宋体",serif;
    font-size: 3em; letter-spacing: 18px; font-weight: bold; color: #6e4f18;
    padding-left: 18px;
    text-shadow: 0 0 20px rgba(212,175,55,0.85), 0 0 40px rgba(255,230,160,0.5), 0 3px 6px rgba(110,79,24,0.35);
    display: inline-block;
  }
  #title::after {
    content: ""; display: block; width: 260px; height: 2px; margin: 10px auto 0;
    background: linear-gradient(90deg, transparent, #c9a227, #ffe9a3, #d4af37, #c9a227, transparent);
    background-size: 200% 100%;
    box-shadow: 0 0 10px rgba(212, 175, 55, 0.8);
    animation: shimmer 4s linear infinite;
  }
  @keyframes shimmer { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

  #main {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
    padding: 0 24px 24px;
    gap: 22px;
    z-index: 5;
    align-items: stretch;
  }

  #video-area {
    width: 70%;
    display: flex;
    align-items: flex-start;
  }
  #video-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 20px;
    padding: 10px;
    background: linear-gradient(145deg, rgba(255,252,242,0.92), rgba(240,228,200,0.7));
    box-shadow:
      0 0 0 2px rgba(201,162,39,0.55),
      0 0 0 5px rgba(255,252,242,0.6),
      0 0 0 6px rgba(201,162,39,0.25),
      0 0 35px rgba(212,175,55,0.35),
      inset 0 0 30px rgba(255,250,235,0.7);
  }
  #video-frame iframe {
    position: absolute;
    top: 10px; left: 10px;
    width: calc(100% - 20px);
    height: calc(100% - 20px);
    border: none;
    border-radius: 12px;
    background: #000;
  }

  #stage {
    width: 30%;
    height: 100%;
    position: relative;
    overflow: hidden;
    border-radius: 20px;
    padding: 10px;
    background: linear-gradient(160deg, rgba(255,252,242,0.55), rgba(240,228,200,0.35));
    box-shadow:
      0 0 0 2px rgba(201,162,39,0.5),
      0 0 0 5px rgba(255,252,242,0.6),
      0 0 0 6px rgba(201,162,39,0.25),
      0 0 30px rgba(212,175,55,0.22),
      inset 0 0 40px rgba(255,250,235,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .blessing {
    position: absolute;
    left: 50%; bottom: -180px;
    transform: translateX(-50%) scale(0.35);
    opacity: 0;
    text-align: center;
    width: 94%;
    pointer-events: none;
    padding: 0; border: none; background: none; box-shadow: none;
    transition:
      transform 3s linear,
      opacity 0.5s ease,
      filter 3s linear;
    will-change: transform, opacity, filter;
    /* 统一使用手写字体 */
    font-family: "Ma Shan Zheng", "STKaiti", "KaiTi", "楷体", serif;
  }

  /* 名字：5em，不加粗（温馨） */
  .blessing .name {
    font-family: inherit;
    font-size: 5em;
    color: #a8843f;
    margin-bottom: 14px;
    font-weight: normal;
    letter-spacing: 4px;
    text-shadow: 0 0 8px rgba(255,230,160,0.5), 0 2px 4px rgba(139,107,46,0.25);
    transition: color 3s linear;
  }
  /* 祝福语：4em，不加粗（温馨） */
  .blessing .msg {
    font-family: inherit;
    font-size: 4.5em;
    font-weight: normal;
    color: #5c4a2a;
    line-height: 1.5;
    word-break: break-word;
    text-shadow: 0 0 6px rgba(255,245,210,0.4), 0 1px 3px rgba(139,107,46,0.2);
    transition: color 3s linear;
  }

  .blessing.rising { animation: floatUp 8s linear forwards; }

  /* 到中央：只变大，不发光 */
  .blessing.center {
    transform: translateX(-50%) scale(1.4);
  }

  @keyframes floatUp {
    0%   { bottom: -180px; opacity: 0; transform: translateX(-50%) scale(0.35); }
    12%  { opacity: 1; }
    88%  { opacity: 1; }
    100% { bottom: 112%; opacity: 0; transform: translateX(-50%) scale(0.35); }
  }
</style>
</head>
<body>

<div id="landscape">
  <img class="painting" src="background.gif" alt="山水画">
  <div class="overlay"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
</div>

<div id="goldDust"></div>
<div id="snowLayer"></div>

<div id="title">
  <div class="line1">謝謝大家蒞臨</div>
  <div class="line2">聖德安座設壇</div>
</div>

<div id="main">
  <div id="video-area">
    <div id="video-frame">
      <iframe
        src="https://www.youtube.com/embed/FSZlyqhg1bw?autoplay=1&mute=1&loop=1&playlist=FSZlyqhg1bw&rel=0"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
  </div>
  <div id="stage"></div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyB8qh5Yrem1ZsaT8VogIlLUHsaZSjkjOu18tCqGuztY45uIlAPJUmPmtfDEtytbjW7WQ/exec";
  const REFRESH_EVERY = 5;

  const INTERVAL = 3000;
  const ANIM_DURATION = 8000;
  const CENTER_START = 2800;
  const CENTER_HOLD  = 3000;
  const CENTER_END   = CENTER_START + CENTER_HOLD;

  (function createSnow() {
    const layer = document.getElementById("snowLayer");
    const COUNT = 25;
    const shapes = ["❄", "❅", "❆", "✻", "✼", "•", "◦"];
    for (let i = 0; i < COUNT; i++) {
      const s = document.createElement("span");
      s.className = "snowflake";
      s.textContent = shapes[Math.floor(Math.random() * shapes.length)];
      const size = 8 + Math.random() * 18;
      s.style.fontSize = size + "px";
      s.style.left = Math.random() * 100 + "vw";
      const dur = 14 + Math.random() * 18;
      s.style.animationDuration = dur + "s";
      s.style.animationDelay = (-Math.random() * dur) + "s";
      s.style.setProperty("--drift", ((Math.random() - 0.5) * 160) + "px");
      s.style.setProperty("--maxOp", (0.3 + Math.random() * 0.5).toFixed(2));
      layer.appendChild(s);
    }
  })();

  (function createDust() {
    const container = document.getElementById("goldDust");
    const COUNT = 40;
    for (let i = 0; i < COUNT; i++) {
      const d = document.createElement("div");
      d.className = "dust";
      d.style.left = Math.random() * 100 + "vw";
      d.style.width = d.style.height = (3 + Math.random() * 5) + "px";
      d.style.animationDuration = (10 + Math.random() * 12) + "s";
      d.style.animationDelay = (-Math.random() * 20) + "s";
      d.style.setProperty("--drift", ((Math.random() - 0.5) * 120) + "px");
      container.appendChild(d);
    }
  })();

  (function createInk() {
    const landscape = document.getElementById("landscape");
    const COUNT = 15;
    for (let i = 0; i < COUNT; i++) {
      const d = document.createElement("div");
      d.className = "ink";
      const size = 4 + Math.random() * 10;
      d.style.width = d.style.height = size + "px";
      d.style.left = Math.random() * 100 + "vw";
      d.style.animationDuration = (18 + Math.random() * 18) + "s";
      d.style.animationDelay = (-Math.random() * 30) + "s";
      d.style.setProperty("--drift", ((Math.random() - 0.5) * 200) + "px");
      landscape.appendChild(d);
    }
  })();

  const stage = document.getElementById("stage");
  let data = [];
  let index = 0;

  async function loadData() {
    try {
      const res = await fetch(API_URL + "?t=" + Date.now());
      const json = await res.json();
      data = json.data || [];
      console.log("已加载数据:", data.length, "条");
    } catch (e) {
      console.error("加载数据失败:", e);
    }
  }

  function showBlessing(item) {
    const div = document.createElement("div");
    div.className = "blessing";
    div.innerHTML = `
      <div class="name">${escapeHTML(item.name)}</div>
      <div class="msg">${escapeHTML(item.msg)}</div>
    `;
    stage.appendChild(div);

    requestAnimationFrame(() => div.classList.add("rising"));

    setTimeout(() => { if (div.isConnected) div.classList.add("center"); }, CENTER_START);
    setTimeout(() => { if (div.isConnected) div.classList.remove("center"); }, CENTER_END);
    setTimeout(() => div.remove(), ANIM_DURATION + 500);
  }

  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  async function start() {
    await loadData();
    if (data.length === 0) { console.warn("没有数据"); return; }
    showBlessing(data[index % data.length]);
    index++;
    setInterval(() => {
      if (data.length === 0) return;
      showBlessing(data[index % data.length]);
      index++;
    }, INTERVAL);
    setInterval(loadData, REFRESH_EVERY * 1000);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) loadData();
    });
  }

  start();
</script>

</body>
</html>
