<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>聖德安座設壇 · 電子簽到</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: #050805;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #e8f0e8;
    }

    /* ===== 底層神聖光暈 ===== */
    .sacred-glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 45%, rgba(80, 140, 80, 0.25) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 20% 80%, rgba(180, 220, 160, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 20%, rgba(200, 230, 180, 0.1) 0%, transparent 60%),
        #050805;
    }

    /* 緩慢飄動的金色粒子（永續層） */
    .ethereal-particles {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .ethereal-particles span {
      position: absolute;
      display: block;
      width: 3px;
      height: 3px;
      background: radial-gradient(circle, #f5e9c8, rgba(245, 233, 200, 0));
      border-radius: 50%;
      opacity: 0.5;
      animation: floatParticle linear infinite;
      box-shadow: 0 0 8px 2px rgba(245, 233, 200, 0.3);
    }

    @keyframes floatParticle {
      0% {
        transform: translateY(110vh) translateX(0) scale(0.6);
        opacity: 0;
      }
      10% {
        opacity: 0.7;
      }
      90% {
        opacity: 0.3;
      }
      100% {
        transform: translateY(-10vh) translateX(40px) scale(1.2);
        opacity: 0;
      }
    }

    /* ===== 影片背景層 ===== */
    .video-bg {
      position: fixed;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      background: #0a0f0a;
    }

    .video-bg video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0.7;
      filter: brightness(0.75) saturate(1.05) contrast(1.05);
    }

    /* 影片上方的柔光與暗角 */
    .video-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 50% 45%, transparent 0%, rgba(5, 8, 5, 0.55) 75%, rgba(5, 8, 5, 0.92) 100%),
        linear-gradient(to bottom, rgba(5, 8, 5, 0.3) 0%, transparent 25%, transparent 65%, rgba(5, 8, 5, 0.5) 100%);
      pointer-events: none;
    }

    /* 影片佔位符（無影片來源時顯示） */
    .video-fallback {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 30% 40%, #162816 0%, #050a05 70%),
        radial-gradient(circle at 75% 65%, #1f3a1f 0%, transparent 55%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
      color: #9dba9d;
      text-align: center;
      padding: 20px;
    }

    .video-fallback .sacred-symbol {
      font-size: 5rem;
      line-height: 1;
      animation: sacredPulse 4s ease-in-out infinite;
      filter: drop-shadow(0 0 30px rgba(160, 220, 140, 0.4));
    }

    @keyframes sacredPulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    .video-fallback .fallback-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: 6px;
      color: #c8dcc0;
      text-shadow: 0 0 30px rgba(180, 220, 160, 0.3);
    }

    .video-fallback .fallback-sub {
      font-size: 0.85rem;
      letter-spacing: 3px;
      color: #7a9a7a;
      font-weight: 400;
      text-transform: uppercase;
    }

    /* ===== 神聖閃光層 ===== */
    .flash-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at 50% 45%, #ffffff 0%, #f0fff0 25%, rgba(200, 255, 200, 0.5) 55%, transparent 80%);
    }

    .flash-overlay.flash-active {
      animation: sacredFlash 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes sacredFlash {
      0% {
        opacity: 0;
        transform: scale(0.7);
      }
      15% {
        opacity: 1;
        transform: scale(1.02);
      }
      35% {
        opacity: 0.9;
        transform: scale(1.12);
      }
      60% {
        opacity: 0.4;
        transform: scale(1.2);
      }
      100% {
        opacity: 0;
        transform: scale(1.35);
      }
    }

    /* 金色射線層 */
    .rays-overlay {
      position: fixed;
      inset: 0;
      z-index: 58;
      pointer-events: none;
      opacity: 0;
    }

    .rays-overlay.rays-active {
      animation: raysFade 1.6s ease-out forwards;
    }

    @keyframes raysFade {
      0% { opacity: 0; }
      20% { opacity: 0.9; }
      60% { opacity: 0.5; }
      100% { opacity: 0; }
    }

    .ray {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 2px;
      height: 140vmax;
      background: linear-gradient(to bottom, transparent 0%, rgba(255, 240, 200, 0.6) 30%, rgba(255, 240, 200, 0.8) 50%, rgba(255, 240, 200, 0.6) 70%, transparent 100%);
      transform-origin: center;
      transform: translate(-50%, -50%) rotate(var(--angle)) scaleY(0);
      animation: rayShoot 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: var(--delay, 0s);
      opacity: 0;
      filter: blur(1px);
    }

    @keyframes rayShoot {
      0% {
        transform: translate(-50%, -50%) rotate(var(--angle)) scaleY(0);
        opacity: 0;
      }
      30% {
        transform: translate(-50%, -50%) rotate(var(--angle)) scaleY(1);
        opacity: 0.9;
      }
      100% {
        transform: translate(-50%, -50%) rotate(var(--angle)) scaleY(1.3);
        opacity: 0;
      }
    }

    /* ===== 飄落花瓣 / 葉片 ===== */
    .petals-container {
      position: fixed;
      inset: 0;
      z-index: 55;
      pointer-events: none;
      overflow: hidden;
    }

    .petal {
      position: absolute;
      top: -10%;
      font-size: 1.2rem;
      opacity: 0;
      animation: petalFall linear forwards;
      filter: drop-shadow(0 0 6px rgba(200, 230, 180, 0.5));
    }

    @keyframes petalFall {
      0% {
        transform: translateY(0) rotate(0deg) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.9;
      }
      90% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(110vh) rotate(360deg) translateX(var(--drift, 60px));
        opacity: 0;
      }
    }

    /* ===== 歡迎彈窗 / 簽到表單 ===== */
    .welcome-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(4, 8, 4, 0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .welcome-modal.show {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: linear-gradient(165deg, rgba(255, 255, 255, 0.97) 0%, rgba(245, 250, 242, 0.98) 100%);
      border-radius: 48px;
      padding: 48px 38px 42px;
      width: 100%;
      max-width: 460px;
      box-shadow:
        0 40px 80px -20px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.7) inset,
        0 0 80px rgba(160, 220, 160, 0.15),
        0 0 120px rgba(200, 230, 180, 0.08);
      transform: translateY(40px) scale(0.94);
      opacity: 0;
      transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.7s ease;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .welcome-modal.show .modal-card {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    /* 卡片頂部神聖光暈 */
    .modal-card::before {
      content: '';
      position: absolute;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 160px;
      background: radial-gradient(ellipse, rgba(180, 230, 160, 0.45) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    /* 卡片頂部裝飾線 */
    .modal-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 3px;
      background: linear-gradient(90deg, transparent, rgba(160, 210, 140, 0.6), transparent);
      border-radius: 0 0 4px 4px;
    }

    .modal-greeting-icon {
      font-size: 3.4rem;
      line-height: 1;
      margin-bottom: 14px;
      display: block;
      animation: sacredBounce 3s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(180, 220, 160, 0.5));
    }

    @keyframes sacredBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.05); }
    }

    .modal-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.1rem;
      font-weight: 600;
      color: #2a422a;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      line-height: 1.25;
    }

    .modal-title span {
      background: linear-gradient(135deg, #3d6e3d, #6aa86a, #8bc48b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
    }

    .modal-sub {
      font-size: 0.95rem;
      color: #7a937a;
      font-weight: 500;
      margin-bottom: 32px;
      letter-spacing: 1.5px;
      line-height: 1.6;
      font-family: 'Quicksand', sans-serif;
    }

    .field {
      text-align: left;
      margin-bottom: 22px;
    }

    .field label {
      display: block;
      font-weight: 600;
      font-size: 0.82rem;
      color: #4f6b4f;
      margin-bottom: 8px;
      letter-spacing: 1.2px;
      padding-left: 8px;
      text-transform: uppercase;
    }

    .field input {
      width: 100%;
      padding: 16px 22px;
      border: 2px solid #dfe8df;
      border-radius: 60px;
      font-size: 1rem;
      font-family: 'Quicksand', sans-serif;
      background: #fbfdfb;
      transition: all 0.3s ease;
      outline: none;
      color: #243024;
      font-weight: 500;
    }

    .field input:focus {
      border-color: #7fb07f;
      background: #ffffff;
      box-shadow: 0 0 0 5px rgba(127, 176, 127, 0.14), 0 0 30px rgba(160, 220, 160, 0.1);
    }

    .field input::placeholder {
      color: #a8b8a8;
      font-weight: 400;
    }

    .modal-submit {
      width: 100%;
      border: none;
      background: linear-gradient(135deg, #3e6b3e, #5a8f5a, #6aa86a);
      color: #ffffff;
      padding: 18px 24px;
      border-radius: 60px;
      font-size: 1.05rem;
      font-weight: 700;
      font-family: 'Quicksand', sans-serif;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 8px;
      box-shadow:
        0 16px 32px -12px rgba(60, 110, 60, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.2) inset;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }

    .modal-submit::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      transition: left 0.6s ease;
    }

    .modal-submit:hover::before {
      left: 100%;
    }

    .modal-submit:hover {
      background: linear-gradient(135deg, #325632, #4a7a4a, #5a8f5a);
      transform: translateY(-2px);
      box-shadow: 0 20px 40px -12px rgba(60, 110, 60, 0.65), 0 0 40px rgba(160, 220, 160, 0.2);
    }

    .modal-submit:active {
      transform: translateY(1px);
      box-shadow: 0 8px 20px -8px rgba(60, 110, 60, 0.5);
    }

    /* ===== 送出後的祝福展示 ===== */
    .blessing-wall {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(4, 8, 4, 0.7);
      backdrop-filter: blur(12px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .blessing-wall.show {
      opacity: 1;
      visibility: visible;
    }

    .wall-card {
      background: linear-gradient(165deg, #ffffff 0%, #f6fbf6 100%);
      border-radius: 48px;
      padding: 42px 34px 36px;
      max-width: 480px;
      width: 100%;
      box-shadow:
        0 40px 80px -20px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.6) inset,
        0 0 100px rgba(160, 220, 160, 0.12);
      transform: scale(0.92) translateY(20px);
      transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .blessing-wall.show .wall-card {
      transform: scale(1) translateY(0);
    }

    .wall-card::before {
      content: '';
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 240px;
      height: 130px;
      background: radial-gradient(ellipse, rgba(180, 230, 160, 0.35) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .wall-card h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.9rem;
      color: #2a422a;
      margin-bottom: 10px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .wall-card .wall-sub {
      color: #7a937a;
      font-size: 0.9rem;
      margin-bottom: 28px;
      font-weight: 500;
      letter-spacing: 1.2px;
    }

    .wall-blessing-item {
      background: #f6fbf6;
      border-radius: 28px;
      padding: 22px 24px;
      margin-bottom: 16px;
      text-align: left;
      border: 1px solid #e0ece0;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      animation: fadeSlideUp 0.7s ease forwards;
      opacity: 0;
      transform: translateY(16px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
    }

    @keyframes fadeSlideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .wall-blessing-item .icon {
      font-size: 2.2rem;
      line-height: 1;
      flex-shrink: 0;
      filter: drop-shadow(0 0 8px rgba(160, 220, 160, 0.4));
    }

    .wall-blessing-item .name {
      font-weight: 700;
      color: #2a422a;
      font-size: 1.05rem;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .wall-blessing-item .msg {
      color: #4f6b4f;
      font-size: 0.95rem;
      line-height: 1.5;
      font-weight: 500;
    }

    .wall-close {
      margin-top: 16px;
      border: none;
      background: #e8f0e8;
      color: #3e6b3e;
      padding: 16px 32px;
      border-radius: 60px;
      font-weight: 700;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border: 1px solid rgba(160, 210, 160, 0.3);
    }

    .wall-close:hover {
      background: #d8e6d8;
      box-shadow: 0 8px 20px -8px rgba(60, 110, 60, 0.3);
      transform: translateY(-2px);
    }

    /* ===== 謝謝 Toast ===== */
    .thankyou-toast {
      position: fixed;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      z-index: 300;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(16px);
      padding: 18px 32px;
      border-radius: 70px;
      box-shadow:
        0 24px 48px -12px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(200, 230, 200, 0.6),
        0 0 60px rgba(160, 220, 160, 0.15);
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 600;
      color: #2a422a;
      opacity: 0;
      transition: all 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
      white-space: nowrap;
      letter-spacing: 1px;
    }

    .thankyou-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .thankyou-toast .emoji {
      font-size: 1.6rem;
      filter: drop-shadow(0 0 10px rgba(180, 220, 160, 0.5));
    }

    /* ===== 響應式 ===== */
    @media (max-width: 520px) {
      .modal-card {
        padding: 36px 24px 32px;
        border-radius: 36px;
      }
      .modal-title {
        font-size: 1.7rem;
      }
      .modal-greeting-icon {
        font-size: 2.8rem;
      }
      .wall-card {
        padding: 32px 22px 28px;
        border-radius: 36px;
      }
      .wall-card h3 {
        font-size: 1.5rem;
      }
      .thankyou-toast {
        font-size: 0.9rem;
        padding: 14px 22px;
        bottom: 28px;
      }
    }

    /* 減少動畫偏好 */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- ===== 神聖光暈底層 ===== -->
  <div class="sacred-glow"></div>

  <!-- ===== 永續飄動粒子 ===== -->
  <div class="ethereal-particles" id="etherealParticles"></div>

  <!-- ===== 影片背景 ===== -->
  <div class="video-bg">
    <!-- 若要使用自己的影片，請將下方 source 的 src 改為您的影片網址 -->
    <video autoplay muted loop playsinline poster="">
      <source src="" type="video/mp4">
    </video>
    <div class="video-overlay"></div>
    <div class="video-fallback" id="videoFallback">
      <div class="sacred-symbol">🌿</div>
      <div class="fallback-text">聖德安座設壇</div>
      <div class="fallback-sub">Welcome · 歡迎您的到來</div>
    </div>
  </div>

  <!-- ===== 閃光與射線層 ===== -->
  <div class="flash-overlay" id="flashOverlay"></div>
  <div class="rays-overlay" id="raysOverlay"></div>
  <div class="petals-container" id="petalsContainer"></div>

  <!-- ===== 歡迎簽到彈窗 ===== -->
  <div class="welcome-modal" id="welcomeModal">
    <div class="modal-card">
      <span class="modal-greeting-icon">🌿</span>
      <h1 class="modal-title">謝謝蒞臨 <span>聖德安座設壇</span></h1>
      <p class="modal-sub">請填上您的姓名與祝福<br>讓這份心意留下美好的印記</p>

      <div class="field">
        <label for="visitorName">您的姓名</label>
        <input type="text" id="visitorName" placeholder="例如：陳小美" maxlength="30" autocomplete="off">
      </div>

      <div class="field">
        <label for="visitorBlessing">您的祝福</label>
        <input type="text" id="visitorBlessing" placeholder="寫下溫暖的祝福..." maxlength="120" autocomplete="off">
      </div>

      <button class="modal-submit" id="submitBlessingBtn">
        <span>送出祝福</span>
      </button>
    </div>
  </div>

  <!-- ===== 送出後的祝福展示 ===== -->
  <div class="blessing-wall" id="blessingWall">
    <div class="wall-card">
      <h3>祝福已收到</h3>
      <p class="wall-sub">感謝您的參與，願美好與您同在</p>
      <div id="wallBlessingContent"></div>
      <button class="wall-close" id="wallCloseBtn">關閉</button>
    </div>
  </div>

  <!-- ===== 謝謝 Toast ===== -->
  <div class="thankyou-toast" id="thankyouToast">
    <span class="emoji">🌿</span>
    <span>祝福已送出，感謝您！</span>
  </div>

  <script>
    (function() {
      'use strict';

      // ---------- DOM 元素 ----------
      const videoEl = document.querySelector('.video-bg video');
      const videoFallback = document.getElementById('videoFallback');
      const flashOverlay = document.getElementById('flashOverlay');
      const raysOverlay = document.getElementById('raysOverlay');
      const petalsContainer = document.getElementById('petalsContainer');
      const welcomeModal = document.getElementById('welcomeModal');
      const visitorName = document.getElementById('visitorName');
      const visitorBlessing = document.getElementById('visitorBlessing');
      const submitBtn = document.getElementById('submitBlessingBtn');
      const thankyouToast = document.getElementById('thankyouToast');
      const blessingWall = document.getElementById('blessingWall');
      const wallBlessingContent = document.getElementById('wallBlessingContent');
      const wallCloseBtn = document.getElementById('wallCloseBtn');
      const etherealParticles = document.getElementById('etherealParticles');

      // ---------- 狀態 ----------
      let hasSubmitted = false;

      // ---------- 永續飄動粒子 ----------
      function createEtherealParticles() {
        const count = 30;
        for (let i = 0; i < count; i++) {
          const span = document.createElement('span');
          span.style.left = Math.random() * 100 + '%';
          span.style.animationDuration = (12 + Math.random() * 20) + 's';
          span.style.animationDelay = (Math.random() * -20) + 's';
          span.style.width = (2 + Math.random() * 4) + 'px';
          span.style.height = span.style.width;
          span.style.opacity = 0.2 + Math.random() * 0.5;
          etherealParticles.appendChild(span);
        }
      }

      // ---------- 影片處理 ----------
      function setupVideo() {
        const sourceEl = videoEl.querySelector('source');
        const hasSource = sourceEl && sourceEl.src && sourceEl.src.trim() !== '' && !sourceEl.src.endsWith(window.location.href);

        if (!hasSource) {
          videoEl.style.display = 'none';
          videoFallback.style.display = 'flex';
        } else {
          videoFallback.style.display = 'none';
          videoEl.style.display = 'block';
          videoEl.play().catch(() => {});
          videoEl.addEventListener('error', () => {
            videoEl.style.display = 'none';
            videoFallback.style.display = 'flex';
          });
          videoEl.addEventListener('loadeddata', () => {
            videoFallback.style.display = 'none';
          });
        }
      }

      // ---------- 神聖閃光 + 射線 + 花瓣 ----------
      function triggerSacredFlash() {
        // 閃光
        flashOverlay.classList.add('flash-active');
        setTimeout(() => {
          flashOverlay.classList.remove('flash-active');
        }, 1600);

        // 射線
        raysOverlay.classList.add('rays-active');
        createRays();
        setTimeout(() => {
          raysOverlay.classList.remove('rays-active');
        }, 2000);

        // 花瓣
        createPetals();
      }

      function createRays() {
        raysOverlay.innerHTML = '';
        const rayCount = 12;
        for (let i = 0; i < rayCount; i++) {
          const ray = document.createElement('div');
          ray.className = 'ray';
          const angle = (i * 30) + (Math.random() * 10 - 5);
          ray.style.setProperty('--angle', angle + 'deg');
          ray.style.setProperty('--delay', (Math.random() * 0.3) + 's');
          raysOverlay.appendChild(ray);
        }
      }

      function createPetals() {
        petalsContainer.innerHTML = '';
        const petalCount = 24;
        const symbols = ['🍃', '🌸', '🌿', '✨', '🍂'];
        for (let i = 0; i < petalCount; i++) {
          const petal = document.createElement('div');
          petal.className = 'petal';
          petal.textContent = symbols[Math.floor(Math.random() * symbols.length)];
          petal.style.left = Math.random() * 100 + '%';
          petal.style.fontSize = (0.8 + Math.random() * 1.2) + 'rem';
          petal.style.animationDuration = (5 + Math.random() * 6) + 's';
          petal.style.animationDelay = (Math.random() * 2) + 's';
          petal.style.setProperty('--drift', (Math.random() * 120 - 60) + 'px');
          petalsContainer.appendChild(petal);
        }
      }

      // ---------- 彈出歡迎視窗 ----------
      function showWelcomeModal() {
        welcomeModal.classList.add('show');
        setTimeout(() => {
          visitorName.focus();
        }, 800);
      }

      // ---------- 頁面載入流程 ----------
      function initSequence() {
        createEtherealParticles();
        setupVideo();

        // 延遲讓影片先播放，然後觸發神聖閃光
        setTimeout(() => {
          triggerSacredFlash();

          // 閃光後彈出歡迎視窗
          setTimeout(() => {
            showWelcomeModal();
          }, 900);
        }, 1200);
      }

      // ---------- 送出祝福 ----------
      function handleSubmit() {
        if (hasSubmitted) return;

        const name = visitorName.value.trim();
        const blessing = visitorBlessing.value.trim();

        if (!name) {
          shakeInput(visitorName);
          visitorName.focus();
          return;
        }
        if (!blessing) {
          shakeInput(visitorBlessing);
          visitorBlessing.focus();
          return;
        }

        hasSubmitted = true;

        showThankyouToast();
        welcomeModal.classList.remove('show');

        setTimeout(() => {
          showBlessingWall(name, blessing);
        }, 600);

        saveBlessingToStorage(name, blessing);
      }

      function shakeInput(input) {
        input.style.transition = 'transform 0.1s ease, border-color 0.2s ease';
        input.style.transform = 'translateX(-8px)';
        input.style.borderColor = '#e07a7a';
        setTimeout(() => { input.style.transform = 'translateX(8px)'; }, 80);
        setTimeout(() => { input.style.transform = 'translateX(-6px)'; }, 160);
        setTimeout(() => { input.style.transform = 'translateX(6px)'; }, 240);
        setTimeout(() => { input.style.transform = 'translateX(-3px)'; }, 320);
        setTimeout(() => { input.style.transform = 'translateX(0)'; input.style.borderColor = ''; }, 400);
      }

      function showThankyouToast() {
        thankyouToast.classList.add('show');
        setTimeout(() => {
          thankyouToast.classList.remove('show');
        }, 3200);
      }

      // ---------- 祝福牆 ----------
      function showBlessingWall(name, blessing) {
        wallBlessingContent.innerHTML = `
          <div class="wall-blessing-item" style="animation-delay: 0.1s">
            <div class="icon">🌿</div>
            <div>
              <div class="name">${escapeHtml(name)}</div>
              <div class="msg">${escapeHtml(blessing)}</div>
            </div>
          </div>
        `;
        blessingWall.classList.add('show');
      }

      wallCloseBtn.addEventListener('click', () => {
        blessingWall.classList.remove('show');
      });

      // ---------- 儲存資料 ----------
      function saveBlessingToStorage(name, blessing) {
        try {
          const key = 'shengde_blessings';
          const existing = JSON.parse(localStorage.getItem(key) || '[]');
          existing.push({
            name: name,
            blessing: blessing,
            timestamp: Date.now()
          });
          localStorage.setItem(key, JSON.stringify(existing));
        } catch (e) {
          // 忽略儲存錯誤
        }
      }

      // ---------- 輔助：escapeHtml ----------
      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      // ---------- 事件綁定 ----------
      submitBtn.addEventListener('click', handleSubmit);

      visitorBlessing.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleSubmit();
        }
      });

      visitorName.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          visitorBlessing.focus();
        }
      });

      // ---------- 啟動 ----------
      initSequence();

      window.addEventListener('load', () => {
        if (videoEl.style.display !== 'none') {
          videoEl.play().catch(() => {});
        }
      });

    })();
  </script>
</body>
</html>
