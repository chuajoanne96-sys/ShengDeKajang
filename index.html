<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>聖德安座設壇 · 電子簽到</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: #fdfaf5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #3a4a3a;
    }

    /* ===== 柔和的多層光暈底層 ===== */
    .soft-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .soft-layer-1 {
      background:
        radial-gradient(ellipse 100% 80% at 50% 30%, rgba(245, 230, 210, 0.7) 0%, transparent 65%),
        radial-gradient(ellipse 70% 60% at 15% 80%, rgba(230, 240, 220, 0.6) 0%, transparent 60%),
        radial-gradient(ellipse 70% 60% at 85% 20%, rgba(250, 235, 225, 0.5) 0%, transparent 60%),
        #fdfaf5;
    }

    .soft-layer-2 {
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 245, 230, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(245, 235, 220, 0.2) 0%, transparent 70%);
      animation: breatheGlow 10s ease-in-out infinite;
    }

    @keyframes breatheGlow {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.06); }
    }

    /* ===== 柔和光暈球體 ===== */
    .glow-orbs {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.45;
      animation: orbFloat 20s ease-in-out infinite;
    }

    .glow-orb:nth-child(1) {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(245, 220, 180, 0.7) 0%, transparent 70%);
      top: -100px;
      left: -100px;
      animation-delay: 0s;
    }

    .glow-orb:nth-child(2) {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(210, 235, 190, 0.65) 0%, transparent 70%);
      bottom: -80px;
      right: -80px;
      animation-delay: -7s;
    }

    .glow-orb:nth-child(3) {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(250, 230, 200, 0.55) 0%, transparent 70%);
      top: 40%;
      right: 10%;
      animation-delay: -14s;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -40px) scale(1.08); }
      66% { transform: translate(-20px, 30px) scale(0.95); }
    }

    /* ===== 植物邊框（四角與邊緣裝飾） ===== */
    .botanical-frame {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    /* 四個角落的植物裝飾 */
    .corner-leaf {
      position: absolute;
      width: 180px;
      height: 180px;
      opacity: 0.35;
    }

    .corner-leaf svg {
      width: 100%;
      height: 100%;
    }

    .corner-leaf.top-left {
      top: 0;
      left: 0;
    }

    .corner-leaf.top-right {
      top: 0;
      right: 0;
      transform: scaleX(-1);
    }

    .corner-leaf.bottom-left {
      bottom: 0;
      left: 0;
      transform: scaleY(-1);
    }

    .corner-leaf.bottom-right {
      bottom: 0;
      right: 0;
      transform: scale(-1, -1);
    }

    /* 上下邊緣的藤蔓線條 */
    .vine-top, .vine-bottom {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      max-width: 700px;
      height: 40px;
      opacity: 0.3;
    }

    .vine-top {
      top: 2vh;
    }

    .vine-bottom {
      bottom: 2vh;
      transform: translateX(-50%) scaleY(-1);
    }

    .vine-top svg, .vine-bottom svg {
      width: 100%;
      height: 100%;
    }

    /* ===== 飄浮的柔光粒子 ===== */
    .soft-particles {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      overflow: hidden;
    }

    .soft-particle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, #fff9ee, rgba(255, 249, 238, 0) 70%);
      opacity: 0;
      animation: softFloat linear infinite;
      box-shadow: 0 0 10px 2px rgba(255, 240, 210, 0.3);
    }

    @keyframes softFloat {
      0% {
        transform: translateY(105vh) translateX(0) scale(0.5);
        opacity: 0;
      }
      10% {
        opacity: 0.8;
      }
      85% {
        opacity: 0.4;
      }
      100% {
        transform: translateY(-5vh) translateX(var(--drift, 40px)) scale(1);
        opacity: 0;
      }
    }

    /* ===== 影片背景層 ===== */
    .video-bg {
      position: fixed;
      inset: 0;
      z-index: 4;
      overflow: hidden;
      background: #fdfaf5;
    }

    .video-bg video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0.45;
      filter: brightness(1.05) saturate(0.9) contrast(0.95);
    }

    /* 影片上方的柔光與暗角 - 柔和版 */
    .video-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 75% 60% at 50% 45%, transparent 0%, rgba(253, 250, 245, 0.35) 65%, rgba(253, 250, 245, 0.8) 100%),
        linear-gradient(to bottom, rgba(253, 250, 245, 0.3) 0%, transparent 25%, transparent 65%, rgba(253, 250, 245, 0.5) 100%);
      pointer-events: none;
    }

    /* 影片佔位符（無影片來源時顯示）- 柔和版 */
    .video-fallback {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 45%, #fdf6ec 0%, #f5ede0 60%, #ede4d5 100%),
        radial-gradient(circle at 25% 75%, #f0ead8 0%, transparent 50%),
        radial-gradient(circle at 75% 25%, #f5efe0 0%, transparent 50%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 26px;
      color: #8a7e6e;
      text-align: center;
      padding: 20px;
    }

    .video-fallback .sacred-symbol {
      font-size: 5rem;
      line-height: 1;
      animation: softPulse 6s ease-in-out infinite;
      filter: drop-shadow(0 0 30px rgba(220, 190, 150, 0.5));
    }

    @keyframes softPulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    .video-fallback .fallback-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: 12px;
      color: #8a7a62;
      text-shadow: 0 0 40px rgba(220, 200, 170, 0.5);
      margin-left: 12px;
    }

    .video-fallback .fallback-sub {
      font-size: 0.78rem;
      letter-spacing: 7px;
      color: #b0a490;
      font-weight: 400;
      text-transform: uppercase;
      font-family: 'Quicksand', sans-serif;
      margin-left: 7px;
    }

    /* ===== 柔和閃光層 ===== */
    .flash-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at 50% 45%, #ffffff 0%, #fffaf0 20%, rgba(255, 240, 220, 0.6) 45%, rgba(255, 235, 210, 0.2) 65%, transparent 85%);
    }

    .flash-overlay.flash-active {
      animation: softFlash 1.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes softFlash {
      0% {
        opacity: 0;
        transform: scale(0.7);
      }
      15% {
        opacity: 0.9;
        transform: scale(1);
      }
      35% {
        opacity: 0.7;
        transform: scale(1.1);
      }
      60% {
        opacity: 0.35;
        transform: scale(1.18);
      }
      100% {
        opacity: 0;
        transform: scale(1.3);
      }
    }

    /* 柔金射線層 */
    .rays-overlay {
      position: fixed;
      inset: 0;
      z-index: 58;
      pointer-events: none;
      opacity: 0;
    }

    .rays-overlay.rays-active {
      animation: raysFade 2.2s ease-out forwards;
    }

    @keyframes raysFade {
      0% { opacity: 0; }
      15% { opacity: 0.7; }
      50% { opacity: 0.4; }
      100% { opacity: 0; }
    }

    .ray {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1.5px;
      height: 140vmax;
      background: linear-gradient(to bottom, transparent 0%, rgba(240, 215, 180, 0.5) 25%, rgba(250, 235, 210, 0.75) 50%, rgba(240, 215, 180, 0.5) 75%, transparent 100%);
      transform-origin: center;
      transform: translate(-50%, -50%) rotate(var(--angle)) scaleY(0);
      animation: rayShoot 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: var(--delay, 0s);
      opacity: 0;
      filter: blur(2px);
      box-shadow: 0 0 16px rgba(240, 215, 180, 0.4);
    }

    @keyframes rayShoot {
      0% {
        transform: translate(-50%, -50%) rotate(var(--angle)) scaleY(0);
        opacity: 0;
      }
      25% {
        transform: translate(-50%, -50%) rotate(var(--angle)) scaleY(1);
        opacity: 0.8;
      }
      100% {
        transform: translate(-50%, -50%) rotate(var(--angle)) scaleY(1.3);
        opacity: 0;
      }
    }

    /* ===== 飄落葉片（替換花瓣） ===== */
    .petals-container {
      position: fixed;
      inset: 0;
      z-index: 55;
      pointer-events: none;
      overflow: hidden;
    }

    .petal {
      position: absolute;
      top: -12%;
      opacity: 0;
      animation: petalFall linear forwards;
      filter: drop-shadow(0 0 8px rgba(230, 210, 180, 0.5));
    }

    @keyframes petalFall {
      0% {
        transform: translateY(0) rotate(0deg) translateX(0) scale(0.6);
        opacity: 0;
      }
      8% {
        opacity: 0.9;
      }
      90% {
        opacity: 0.5;
      }
      100% {
        transform: translateY(112vh) rotate(380deg) translateX(var(--drift, 70px)) scale(1.05);
        opacity: 0;
      }
    }

    /* ===== 歡迎彈窗 / 簽到表單 ===== */
    .welcome-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(253, 250, 245, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 1s ease, visibility 1s ease;
    }

    .welcome-modal.show {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: linear-gradient(168deg, rgba(255, 255, 255, 0.98) 0%, rgba(255, 252, 248, 0.99) 50%, rgba(252, 248, 242, 1) 100%);
      border-radius: 56px;
      padding: 56px 44px 48px;
      width: 100%;
      max-width: 480px;
      box-shadow:
        0 40px 80px -20px rgba(180, 160, 130, 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.9) inset,
        0 0 0 2px rgba(240, 220, 190, 0.2) inset,
        0 0 80px rgba(245, 220, 180, 0.2),
        0 0 140px rgba(240, 230, 210, 0.15);
      transform: translateY(40px) scale(0.94);
      opacity: 0;
      transition: transform 1.1s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.9s ease;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .welcome-modal.show .modal-card {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    /* 卡片頂部柔和光暈 */
    .modal-card::before {
      content: '';
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      height: 200px;
      background: radial-gradient(ellipse, rgba(245, 220, 180, 0.4) 0%, rgba(250, 235, 210, 0.15) 40%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    /* 卡片頂部金色裝飾線 */
    .modal-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 65%;
      height: 2.5px;
      background: linear-gradient(90deg, transparent, rgba(230, 200, 160, 0.7) 20%, rgba(250, 235, 210, 0.9) 50%, rgba(230, 200, 160, 0.7) 80%, transparent);
      border-radius: 0 0 6px 6px;
      box-shadow: 0 0 18px rgba(240, 220, 190, 0.4);
    }

    /* 卡片內的植物裝飾邊框 */
    .modal-card .inner-botanical {
      position: absolute;
      inset: 16px;
      border-radius: 44px;
      border: 1px solid rgba(220, 200, 170, 0.2);
      pointer-events: none;
    }

    .modal-card .inner-botanical::before,
    .modal-card .inner-botanical::after {
      content: '';
      position: absolute;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(200, 180, 150, 0.3);
    }

    .modal-card .inner-botanical::before {
      top: -1px;
      left: -1px;
      border-right: none;
      border-bottom: none;
      border-radius: 12px 0 0 0;
    }

    .modal-card .inner-botanical::after {
      bottom: -1px;
      right: -1px;
      border-left: none;
      border-top: none;
      border-radius: 0 0 12px 0;
    }

    .modal-greeting-icon {
      font-size: 4rem;
      line-height: 1;
      margin-bottom: 18px;
      display: block;
      animation: softBounce 4s ease-in-out infinite;
      filter: drop-shadow(0 0 25px rgba(230, 200, 160, 0.5));
    }

    @keyframes softBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.04); }
    }

    .modal-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.3rem;
      font-weight: 600;
      color: #5a4e3e;
      letter-spacing: 2px;
      margin-bottom: 10px;
      line-height: 1.2;
    }

    .modal-title span {
      background: linear-gradient(135deg, #8a7a62, #a89878, #c4b498, #d4c4a8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
    }

    .modal-sub {
      font-size: 0.92rem;
      color: #a89880;
      font-weight: 500;
      margin-bottom: 36px;
      letter-spacing: 2px;
      line-height: 1.7;
      font-family: 'Quicksand', sans-serif;
    }

    .field {
      text-align: left;
      margin-bottom: 24px;
      position: relative;
    }

    .field label {
      display: block;
      font-weight: 600;
      font-size: 0.78rem;
      color: #8a7e6e;
      margin-bottom: 9px;
      letter-spacing: 2px;
      padding-left: 10px;
      text-transform: uppercase;
    }

    .field input {
      width: 100%;
      padding: 18px 24px;
      border: 2px solid #ede4d8;
      border-radius: 60px;
      font-size: 1rem;
      font-family: 'Quicksand', sans-serif;
      background: #fdfaf7;
      transition: all 0.4s ease;
      outline: none;
      color: #4a4038;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .field input:focus {
      border-color: #d4c4a8;
      background: #ffffff;
      box-shadow:
        0 0 0 6px rgba(212, 196, 168, 0.12),
        0 0 40px rgba(240, 220, 190, 0.2),
        0 4px 20px rgba(180, 160, 130, 0.06);
    }

    .field input::placeholder {
      color: #c8bca8;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    .modal-submit {
      width: 100%;
      border: none;
      background: linear-gradient(135deg, #c4b498, #d4c4a8, #e0d4c0);
      color: #5a4e3e;
      padding: 20px 28px;
      border-radius: 60px;
      font-size: 1.05rem;
      font-weight: 700;
      font-family: 'Quicksand', sans-serif;
      letter-spacing: 3px;
      cursor: pointer;
      transition: all 0.4s ease;
      margin-top: 10px;
      box-shadow:
        0 18px 36px -14px rgba(180, 160, 130, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.4) inset,
        0 0 40px rgba(240, 220, 190, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
    }

    .modal-submit::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transition: left 0.8s ease;
    }

    .modal-submit:hover::before {
      left: 100%;
    }

    .modal-submit:hover {
      background: linear-gradient(135deg, #b8a888, #c8b898, #d4c4a8);
      transform: translateY(-3px);
      box-shadow:
        0 24px 48px -14px rgba(180, 160, 130, 0.6),
        0 0 60px rgba(240, 220, 190, 0.3);
    }

    .modal-submit:active {
      transform: translateY(1px);
      box-shadow: 0 8px 20px -8px rgba(180, 160, 130, 0.4);
    }

    /* ===== 送出後的祝福展示 ===== */
    .blessing-wall {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(253, 250, 245, 0.7);
      backdrop-filter: blur(18px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 1s ease, visibility 1s ease;
    }

    .blessing-wall.show {
      opacity: 1;
      visibility: visible;
    }

    .wall-card {
      background: linear-gradient(168deg, #ffffff 0%, #fffcf8 50%, #fcf8f2 100%);
      border-radius: 56px;
      padding: 50px 40px 42px;
      max-width: 500px;
      width: 100%;
      box-shadow:
        0 40px 80px -20px rgba(180, 160, 130, 0.4),
        0 0 0 1px rgba(255, 255, 255, 0.8) inset,
        0 0 0 2px rgba(240, 220, 190, 0.15) inset,
        0 0 100px rgba(245, 220, 180, 0.2);
      transform: scale(0.9) translateY(30px);
      transition: transform 1s cubic-bezier(0.22, 1, 0.36, 1);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .blessing-wall.show .wall-card {
      transform: scale(1) translateY(0);
    }

    .wall-card::before {
      content: '';
      position: absolute;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 160px;
      background: radial-gradient(ellipse, rgba(245, 220, 180, 0.35) 0%, rgba(250, 235, 210, 0.12) 40%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .wall-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 2.5px;
      background: linear-gradient(90deg, transparent, rgba(230, 200, 160, 0.7) 20%, rgba(250, 235, 210, 0.9) 50%, rgba(230, 200, 160, 0.7) 80%, transparent);
      border-radius: 0 0 6px 6px;
      box-shadow: 0 0 18px rgba(240, 220, 190, 0.4);
    }

    /* 祝福牆卡片內的植物邊框 */
    .wall-card .inner-botanical {
      position: absolute;
      inset: 14px;
      border-radius: 44px;
      border: 1px solid rgba(220, 200, 170, 0.15);
      pointer-events: none;
    }

    .wall-card .inner-botanical::before,
    .wall-card .inner-botanical::after {
      content: '';
      position: absolute;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(200, 180, 150, 0.25);
    }

    .wall-card .inner-botanical::before {
      top: -1px;
      left: -1px;
      border-right: none;
      border-bottom: none;
      border-radius: 10px 0 0 0;
    }

    .wall-card .inner-botanical::after {
      bottom: -1px;
      right: -1px;
      border-left: none;
      border-top: none;
      border-radius: 0 0 10px 0;
    }

    .wall-card h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.1rem;
      color: #5a4e3e;
      margin-bottom: 12px;
      font-weight: 600;
      letter-spacing: 3px;
    }

    .wall-card .wall-sub {
      color: #a89880;
      font-size: 0.88rem;
      margin-bottom: 32px;
      font-weight: 500;
      letter-spacing: 2px;
      line-height: 1.6;
    }

    .wall-blessing-item {
      background: linear-gradient(135deg, #fdfaf7 0%, #fcf8f2 100%);
      border-radius: 32px;
      padding: 26px 28px;
      margin-bottom: 18px;
      text-align: left;
      border: 1px solid #ede4d8;
      display: flex;
      gap: 18px;
      align-items: flex-start;
      animation: fadeSlideUp 0.8s ease forwards;
      opacity: 0;
      transform: translateY(20px);
      box-shadow: 0 6px 24px rgba(180, 160, 130, 0.06), 0 0 0 1px rgba(255, 255, 255, 0.7) inset;
    }

    @keyframes fadeSlideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .wall-blessing-item .icon {
      font-size: 2.4rem;
      line-height: 1;
      flex-shrink: 0;
      filter: drop-shadow(0 0 12px rgba(230, 200, 160, 0.5));
    }

    .wall-blessing-item .name {
      font-weight: 700;
      color: #4a4038;
      font-size: 1.1rem;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .wall-blessing-item .msg {
      color: #8a7e6e;
      font-size: 0.95rem;
      line-height: 1.55;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .wall-close {
      margin-top: 18px;
      border: none;
      background: linear-gradient(135deg, #f0e8dc, #e8dccc);
      color: #8a7a62;
      padding: 18px 36px;
      border-radius: 60px;
      font-weight: 700;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.4s ease;
      width: 100%;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      border: 1px solid rgba(220, 200, 170, 0.4);
      box-shadow: 0 4px 12px rgba(180, 160, 130, 0.05);
    }

    .wall-close:hover {
      background: linear-gradient(135deg, #e8dccc, #dcd0bc);
      box-shadow: 0 12px 28px -8px rgba(180, 160, 130, 0.3);
      transform: translateY(-2px);
    }

    /* ===== 謝謝 Toast ===== */
    .thankyou-toast {
      position: fixed;
      bottom: 52px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      z-index: 300;
      background: rgba(255, 255, 255, 0.99);
      backdrop-filter: blur(20px);
      padding: 20px 36px;
      border-radius: 80px;
      box-shadow:
        0 28px 56px -14px rgba(180, 160, 130, 0.4),
        0 0 0 1px rgba(240, 220, 190, 0.5),
        0 0 0 2px rgba(255, 255, 255, 0.6) inset,
        0 0 80px rgba(245, 220, 180, 0.2);
      display: flex;
      align-items: center;
      gap: 16px;
      font-weight: 600;
      color: #5a4e3e;
      opacity: 0;
      transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
      white-space: nowrap;
      letter-spacing: 1.5px;
    }

    .thankyou-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .thankyou-toast .emoji {
      font-size: 1.7rem;
      filter: drop-shadow(0 0 14px rgba(230, 200, 160, 0.6));
    }

    /* ===== 響應式 ===== */
    @media (max-width: 520px) {
      .modal-card {
        padding: 42px 28px 38px;
        border-radius: 42px;
      }
      .modal-title {
        font-size: 1.9rem;
        letter-spacing: 1.5px;
      }
      .modal-greeting-icon {
        font-size: 3.2rem;
      }
      .modal-sub {
        font-size: 0.85rem;
        letter-spacing: 1.5px;
      }
      .wall-card {
        padding: 38px 26px 32px;
        border-radius: 42px;
      }
      .wall-card h3 {
        font-size: 1.7rem;
      }
      .thankyou-toast {
        font-size: 0.85rem;
        padding: 16px 24px;
        bottom: 32px;
        letter-spacing: 1px;
      }
      .corner-leaf {
        width: 120px;
        height: 120px;
      }
      .vine-top, .vine-bottom {
        width: 85%;
      }
      .glow-orb {
        filter: blur(40px);
      }
    }

    /* 減少動畫偏好 */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- ===== 柔和多層光暈 ===== -->
  <div class="soft-layer soft-layer-1"></div>
  <div class="soft-layer soft-layer-2"></div>

  <!-- ===== 柔和光暈球體 ===== -->
  <div class="glow-orbs">

  <!-- ===== 植物邊框裝飾 ===== -->
  <div class="botanical-frame">

        <ellipse cx="45" cy="75" rx="12" ry="22" transform="rotate(-30 45 75)" fill="#c4b498" opacity="0.25"/>

        <ellipse cx="70" cy="45" rx="9" ry="16" transform="rotate(-50 70 45)" fill="#d4c4a8" opacity="0.2"/>

        <path d="M20 180 C20 120, 40 60, 100 20" stroke="#b8a888" stroke-width="1.5" fill="none" opacity="0.6"/>
        <path d="M100 20 C80 30, 60 50, 50 80" stroke="#b8a888" stroke-width="1.2" fill="none" opacity="0.5"/>
        <path d="M100 20 C120 35, 135 60, 140 90" stroke="#b8a888" stroke-width="1.2" fill="none" opacity="0.5"/>
        <ellipse cx="45" cy="75" rx="12" ry="22" transform="rotate(-30 45 75)" fill="#c4b498" opacity="0.25"/>

        <ellipse cx="70" cy="45" rx="9" ry="16" transform="rotate(-50 70 45)" fill="#d4c4a8" opacity="0.2"/>

      </svg>
    </div>
    <div class="corner-leaf bottom-right">
      <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 180 C20 120, 40 60, 100 20" stroke="#b8a888" stroke-width="1.5" fill="none" opacity="0.6"/>
        <path d="M100 20 C80 30, 60 50, 50 80" stroke="#b8a888" stroke-width="1.2" fill="none" opacity="0.5"/>
        <path d="M100 20 C120 35, 135 60, 140 90" stroke="#b8a888" stroke-width="1.2" fill="none" opacity="0.5"/>
        <ellipse cx="45" cy="75" rx="12" ry="22" transform="rotate(-30 45 75)" fill="#c4b498" opacity="0.25"/>
        <ellipse cx="135" cy="85" rx="11" ry="20" transform="rotate(25 135 85)" fill="#c4b498" opacity="0.25"/>
        <ellipse cx="70" cy="45" rx="9" ry="16" transform="rotate(-50 70 45)" fill="#d4c4a8" opacity="0.2"/>
        <ellipse cx="115" cy="50" rx="9" ry="16" transform="rotate(40 115 50)" fill="#d4c4a8" opacity="0.2"/>
        <circle cx="100" cy="20" r="4" fill="#b8a888" opacity="0.4"/>
      </svg>
    </div>

    <!-- 頂部藤蔓線條 -->
    <div class="vine-top">
      <svg viewBox="0 0 700 40" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <path d="M0 20 Q50 5, 100 20 T200 20 T300 20 T400 20 T500 20 T600 20 T700 20" stroke="#b8a888" stroke-width="1.2" fill="none" opacity="0.5"/>
        <ellipse cx="80" cy="14" rx="6" ry="10" transform="rotate(-20 80 14)" fill="#c4b498" opacity="0.25"/>
        <ellipse cx="180" cy="26" rx="5" ry="9" transform="rotate(15 180 26)" fill="#c4b498" opacity="0.25"/>
        <ellipse cx="280" cy="14" rx="6" ry="10" transform="rotate(-25 280 14)" fill="#c4b498" opacity="0.25"/>
        <ellipse cx="380" cy="26" rx="5" ry="9" transform="rotate(20 380 26)" fill="#c4b498" opacity="0.25"/>
        <ellipse cx="480" cy="14" rx="6" ry="10" transform="rotate(-15 480 14)" fill="#c4b498" opacity="0.25"/>
        <ellipse cx="580" cy="26" rx="5" ry="9" transform="rotate(25 580 26)" fill="#c4b498" opacity="0.25"/>
        <circle cx="130" cy="20" r="2.5" fill="#b8a888" opacity="0.35"/>
        <circle cx="330" cy="20" r="2.5" fill="#b8a888" opacity="0.35"/>
        <circle cx="530" cy="20" r="2.5" fill="#b8a888" opacity="0.35"/>
      </svg>
    </div>

    <!-- 底部藤蔓線條 -->
    <div class="vine-bottom">
      <svg viewBox="0 0 700 40" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <path d="M0 20 Q50 5, 100 20 T200 20 T300 20 T400 20 T500 20 T600 20 T700 20" stroke="#b8a888" stroke-width="1.2" fill="none" opacity="0.5"/>
        <ellipse cx="80" cy="14" rx="6" ry="10" transform="rotate(-20 80 14)" fill="#c4b498" opacity="0.25"/>
        <ellipse cx="180" cy="26" rx="5" ry="9" transform="rotate(15 180 26)" fill="#c4b498" opacity="0.25"/>
        <ellipse cx="280" cy="14" rx="6" ry="10" transform="rotate(-25 280 14)" fill="#c4b498" opacity="0.25"/>
        <ellipse cx="380" cy="26" rx="5" ry="9" transform="rotate(20 380 26)" fill="#c4b498" opacity="0.25"/>
        <ellipse cx="480" cy="14" rx="6" ry="10" transform="rotate(-15 480 14)" fill="#c4b498" opacity="0.25"/>
        <ellipse cx="580" cy="26" rx="5" ry="9" transform="rotate(25 580 26)" fill="#c4b498" opacity="0.25"/>
        <circle cx="130" cy="20" r="2.5" fill="#b8a888" opacity="0.35"/>
        <circle cx="330" cy="20" r="2.5" fill="#b8a888" opacity="0.35"/>
        <circle cx="530" cy="20" r="2.5" fill="#b8a888" opacity="0.35"/>
      </svg>
    </div>
  </div>

  <!-- ===== 飄浮柔光粒子 ===== -->
  <div class="soft-particles" id="softParticles"></div>

  <!-- ===== 影片背景 ===== -->
  <div class="video-bg">
    <!-- 若要使用自己的影片，請將下方 source 的 src 改為您的影片網址 -->
    <video autoplay muted loop playsinline poster="">
      <source src="" type="video/mp4">
    </video>
    <div class="video-overlay"></div>
    <div class="video-fallback" id="videoFallback">
      <div class="sacred-symbol">🌿</div>
      <div class="fallback-text">聖德安座設壇</div>
      <div class="fallback-sub">Sacred Ceremony · 誠摯邀請</div>
    </div>
  </div>

  <!-- ===== 柔和閃光與射線層 ===== -->
  <div class="flash-overlay" id="flashOverlay"></div>
  <div class="rays-overlay" id="raysOverlay"></div>
  <div class="petals-container" id="petalsContainer"></div>

  <!-- ===== 歡迎簽到彈窗 ===== -->
  <div class="welcome-modal" id="welcomeModal">
    <div class="modal-card">
      <div class="inner-botanical"></div>
      <span class="modal-greeting-icon">🌿</span>
      <h1 class="modal-title">謝謝蒞臨 <span>聖德安座設壇</span></h1>
      <p class="modal-sub">請填上您的姓名與祝福<br>讓這份心意留下美好的印記</p>

      <div class="field">
        <label for="visitorName">您的姓名</label>
        <input type="text" id="visitorName" placeholder="例如：陳小美" maxlength="30" autocomplete="off">
      </div>

      <div class="field">
        <label for="visitorBlessing">您的祝福</label>
        <input type="text" id="visitorBlessing" placeholder="寫下溫暖的祝福..." maxlength="120" autocomplete="off">
      </div>

      <button class="modal-submit" id="submitBlessingBtn">
        <span>送出祝福</span>
      </button>
    </div>
  </div>

  <!-- ===== 送出後的祝福展示 ===== -->
  <div class="blessing-wall" id="blessingWall">
    <div class="wall-card">
      <div class="inner-botanical"></div>
      <h3>祝福已收到</h3>
      <p class="wall-sub">感謝您的參與，願美好與您同在</p>
      <div id="wallBlessingContent"></div>
      <button class="wall-close" id="wallCloseBtn">關閉</button>
    </div>
  </div>

  <!-- ===== 謝謝 Toast ===== -->
  <div class="thankyou-toast" id="thankyouToast">
    <span class="emoji">🌿</span>
    <span>祝福已送出，感謝您！</span>
  </div>

  <script>
    (function() {
      'use strict';

      // ---------- DOM 元素 ----------
      const videoEl = document.querySelector('.video-bg video');
      const videoFallback = document.getElementById('videoFallback');
      const flashOverlay = document.getElementById('flashOverlay');
      const raysOverlay = document.getElementById('raysOverlay');
      const petalsContainer = document.getElementById('petalsContainer');
      const welcomeModal = document.getElementById('welcomeModal');
      const visitorName = document.getElementById('visitorName');
      const visitorBlessing = document.getElementById('visitorBlessing');
      const submitBtn = document.getElementById('submitBlessingBtn');
      const thankyouToast = document.getElementById('thankyouToast');
      const blessingWall = document.getElementById('blessingWall');
      const wallBlessingContent = document.getElementById('wallBlessingContent');
      const wallCloseBtn = document.getElementById('wallCloseBtn');
      const softParticles = document.getElementById('softParticles');

      // ---------- 狀態 ----------
      let hasSubmitted = false;

      // ---------- 飄浮柔光粒子 ----------
      function createSoftParticles() {
        const count = 40;
        for (let i = 0; i < count; i++) {
          const span = document.createElement('span');
          span.className = 'soft-particle';
          span.style.left = Math.random() * 100 + '%';
          span.style.animationDuration = (12 + Math.random() * 24) + 's';
          span.style.animationDelay = (Math.random() * -28) + 's';
          const size = 2 + Math.random() * 5;
          span.style.width = size + 'px';
          span.style.height = size + 'px';
          span.style.setProperty('--drift', (Math.random() * 100 - 50) + 'px');
          span.style.opacity = 0.2 + Math.random() * 0.5;
          softParticles.appendChild(span);
        }
      }

      // ---------- 影片處理 ----------
      function setupVideo() {
        const sourceEl = videoEl.querySelector('source');
        const hasSource = sourceEl && sourceEl.src && sourceEl.src.trim() !== '' && !sourceEl.src.endsWith(window.location.href);

        if (!hasSource) {
          videoEl.style.display = 'none';
          videoFallback.style.display = 'flex';
        } else {
          videoFallback.style.display = 'none';
          videoEl.style.display = 'block';
          videoEl.play().catch(() => {});
          videoEl.addEventListener('error', () => {
            videoEl.style.display = 'none';
            videoFallback.style.display = 'flex';
          });
          videoEl.addEventListener('loadeddata', () => {
            videoFallback.style.display = 'none';
          });
        }
      }

      // ---------- 柔和閃光 + 射線 + 葉片 ----------
      function triggerSoftFlash() {
        // 閃光
        flashOverlay.classList.add('flash-active');
        setTimeout(() => {
          flashOverlay.classList.remove('flash-active');
        }, 2000);

        // 射線
        raysOverlay.classList.add('rays-active');
        createRays();
        setTimeout(() => {
          raysOverlay.classList.remove('rays-active');
        }, 2600);

        // 葉片
        createPetals();
      }

      function createRays() {
        raysOverlay.innerHTML = '';
        const rayCount = 14;
        for (let i = 0; i < rayCount; i++) {
          const ray = document.createElement('div');
          ray.className = 'ray';
          const angle = (i * 25.7) + (Math.random() * 10 - 5);
          ray.style.setProperty('--angle', angle + 'deg');
          ray.style.setProperty('--delay', (Math.random() * 0.5) + 's');
          raysOverlay.appendChild(ray);
        }
      }

      function createPetals() {
        petalsContainer.innerHTML = '';
        const petalCount = 30;
        const symbols = ['🍃', '🌿', '🍂', '✨', '🌱', '🍀'];
        for (let i = 0; i < petalCount; i++) {
          const petal = document.createElement('div');
          petal.className = 'petal';
          petal.textContent = symbols[Math.floor(Math.random() * symbols.length)];
          petal.style.left = Math.random() * 100 + '%';
          petal.style.fontSize = (0.9 + Math.random() * 1.5) + 'rem';
          petal.style.animationDuration = (7 + Math.random() * 9) + 's';
          petal.style.animationDelay = (Math.random() * 3) + 's';
          petal.style.setProperty('--drift', (Math.random() * 140 - 70) + 'px');
          petalsContainer.appendChild(petal);
        }
      }

      // ---------- 彈出歡迎視窗 ----------
      function showWelcomeModal() {
        welcomeModal.classList.add('show');
        setTimeout(() => {
          visitorName.focus();
        }, 1000);
      }

      // ---------- 頁面載入流程 ----------
      function initSequence() {
        createSoftParticles();
        setupVideo();

        // 延遲讓影片先播放，然後觸發柔和閃光
        setTimeout(() => {
          triggerSoftFlash();

          // 閃光後彈出歡迎視窗
          setTimeout(() => {
            showWelcomeModal();
          }, 1200);
        }, 1600);
      }

      // ---------- 送出祝福 ----------
      function handleSubmit() {
        if (hasSubmitted) return;

        const name = visitorName.value.trim();
        const blessing = visitorBlessing.value.trim();

        if (!name) {
          shakeInput(visitorName);
          visitorName.focus();
          return;
        }
        if (!blessing) {
          shakeInput(visitorBlessing);
          visitorBlessing.focus();
          return;
        }

        hasSubmitted = true;

        showThankyouToast();
        welcomeModal.classList.remove('show');

        setTimeout(() => {
          showBlessingWall(name, blessing);
        }, 700);

        saveBlessingToStorage(name, blessing);
      }

      function shakeInput(input) {
        input.style.transition = 'transform 0.1s ease, border-color 0.2s ease';
        input.style.transform = 'translateX(-10px)';
        input.style.borderColor = '#e0b0a0';
        setTimeout(() => { input.style.transform = 'translateX(10px)'; }, 80);
        setTimeout(() => { input.style.transform = 'translateX(-8px)'; }, 160);
        setTimeout(() => { input.style.transform = 'translateX(8px)'; }, 240);
        setTimeout(() => { input.style.transform = 'translateX(-4px)'; }, 320);
        setTimeout(() => { input.style.transform = 'translateX(0)'; input.style.borderColor = ''; }, 420);
      }

      function showThankyouToast() {
        thankyouToast.classList.add('show');
        setTimeout(() => {
          thankyouToast.classList.remove('show');
        }, 3600);
      }

      // ---------- 祝福牆 ----------
      function showBlessingWall(name, blessing) {
        wallBlessingContent.innerHTML = `
          <div class="wall-blessing-item" style="animation-delay: 0.1s">
            <div class="icon">🌿</div>
            <div>
              <div class="name">${escapeHtml(name)}</div>
              <div class="msg">${escapeHtml(blessing)}</div>
            </div>
          </div>
        `;
        blessingWall.classList.add('show');
      }

      wallCloseBtn.addEventListener('click', () => {
        blessingWall.classList.remove('show');
      });

      // ---------- 儲存資料 ----------
      function saveBlessingToStorage(name, blessing) {
        try {
          const key = 'shengde_blessings';
          const existing = JSON.parse(localStorage.getItem(key) || '[]');
          existing.push({
            name: name,
            blessing: blessing,
            timestamp: Date.now()
          });
          localStorage.setItem(key, JSON.stringify(existing));
        } catch (e) {
          // 忽略儲存錯誤
        }
      }

      // ---------- 輔助：escapeHtml ----------
      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      // ---------- 事件綁定 ----------
      submitBtn.addEventListener('click', handleSubmit);

      visitorBlessing.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleSubmit();
        }
      });

      visitorName.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          visitorBlessing.focus();
        }
      });

      // ---------- 啟動 ----------
      initSequence();

      window.addEventListener('load', () => {
        if (videoEl.style.display !== 'none') {
          videoEl.play().catch(() => {});
        }
      });

    })();
  </script>
</body>
</html>
